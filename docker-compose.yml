version: '3.8'

services:
  # Firebird 5.0 database server
  firebird:
    image: firebirdsql/firebird:5.0
    container_name: frodo-firebird
    environment:
      # SYSDBA password (change in production!)
      ISC_PASSWORD: masterkey
      # Don't set FIREBIRD_DATABASE - we create manually with UTF-8 and 32K page size
      # Timezone (optional)
      TZ: Europe/Vienna
    ports:
      # Expose Firebird port to host
      - "3050:3050"
    volumes:
      # Persist database files
      - firebird-data:/firebird/data
      # Optional: Mount database creation script
      # - ./src/main/resources/db/create-database.sql:/tmp/create-database.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/firebird/bin/isql", "-user", "sysdba", "-password", "masterkey", "-z"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frodo-network

  # Frodo application with GPIO support (RPi5 only)
  # Usage: docker compose --profile gpio up -d
  # Requires: .env file with GPIO_GROUP_ID (see .env.example)
  # See docs/DOCKER_GPIO.md for setup instructions
  frodo-gpio:
    image: docker.io/wolfgangreder/at.or.reder.frodo:latest
    container_name: frodo-app-gpio
    profiles:
      - gpio
    depends_on:
      firebird:
        condition: service_healthy
    environment:
      # Database connection
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:firebirdsql://firebird:3050//firebird/data/frodo.fdb?encoding=UTF8&charSet=utf-8
      QUARKUS_DATASOURCE_USERNAME: sysdba
      QUARKUS_DATASOURCE_PASSWORD: masterkey
      # GPIO configuration — force platform detection (skip /proc/cpuinfo)
      FRODO_GPIO_ENABLED: "true"
      FRODO_GPIO_CHIP_DEVICE: /dev/gpiochip0
      FRODO_GPIO_FORCE_PLATFORM: "true"
      # GPIO pairs — uncomment and configure per deployment:
      # FRODO_GPIO_PAIRS_RELAY1_OUTPUT_PIN: "17"
      # FRODO_GPIO_PAIRS_RELAY1_OUTPUT_BLOCK_LEVEL: "HIGH"
      # FRODO_GPIO_PAIRS_RELAY1_INPUT_PIN: "27"
      # FRODO_GPIO_PAIRS_RELAY1_INPUT_ACTIVE_LEVEL: "HIGH"
      # FRODO_GPIO_PAIRS_RELAY1_INPUT_BIAS: "PULL_DOWN"
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    group_add:
      - "${GPIO_GROUP_ID:-997}"
    ports:
      - "8082:8082"
    networks:
      - frodo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frodo application (standard, no GPIO)
  # Usage: uncomment and run: docker compose up -d frodo
  # frodo:
  #   image: docker.io/wolfgangreder/at.or.reder.frodo:latest
  #   container_name: frodo-app
  #   depends_on:
  #     firebird:
  #       condition: service_healthy
  #   environment:
  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:firebirdsql://firebird:3050//firebird/data/frodo.fdb?encoding=UTF8&charSet=utf-8
  #     QUARKUS_DATASOURCE_USERNAME: sysdba
  #     QUARKUS_DATASOURCE_PASSWORD: masterkey
  #   ports:
  #     - "8082:8082"
  #   networks:
  #     - frodo-network
  #   restart: unless-stopped

volumes:
  # Named volume for Firebird database persistence
  firebird-data:
    driver: local

networks:
  # Custom network for Frodo services
  frodo-network:
    driver: bridge
