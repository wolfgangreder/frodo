plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    // REST API with OpenAPI/Swagger support
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-openapi'

    // REST Client for Solar API integration
    implementation 'io.quarkus:quarkus-rest-client-jackson'

    // Health checks
    implementation 'io.quarkus:quarkus-smallrye-health'

    // Monitoring: Micrometer with Prometheus registry (JVM, app, OS metrics)
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'

    // MQTT messaging
    implementation 'io.quarkus:quarkus-messaging-mqtt'

    // Database: Agroal connection pool + Jaybird FirebirdSQL JDBC driver
    implementation 'io.quarkus:quarkus-agroal'
    runtimeOnly 'org.firebirdsql.jdbc:jaybird:6.0.5'

    // Hibernate ORM with Panache + Liquibase migrations
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    // Firebird dialect moved to community dialects artifact in Hibernate ORM 6+
    implementation 'org.hibernate.orm:hibernate-community-dialects:7.4.4.Final'

    // Quarkus Scheduler for background jobs
    implementation 'io.quarkus:quarkus-scheduler'

    // Docker container image generation
    implementation 'io.quarkus:quarkus-container-image-docker'

    // Modbus protocol library (raw TCP/serial access to Modbus devices)
    implementation 'com.ghgande:j2mod:3.3.0'

    // React UI via Quinoa (builds and serves the frontend)
    implementation 'io.quarkiverse.quinoa:quarkus-quinoa:2.8.2'

    implementation 'io.quarkus:quarkus-arc'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
}

group = 'at.or.reder.frodo'
version = project.property('projectVersion')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// Generate version.properties with project version
tasks.named('processResources') {
    dependsOn syncFrontendVersion
    filesMatching('**/version.properties') {
        expand(projectVersion: project.version)
    }
}

// Security: Scan for secrets and sensitive data
tasks.register('scanSecrets', Exec) {
    group = 'verification'
    description = 'Scans for secrets, passwords, and sensitive data using gitleaks'
    
    commandLine 'sh', '-c', '''
        if ! command -v gitleaks &> /dev/null; then
            echo "❌ Gitleaks is not installed. Please install it:"
            echo "   macOS: brew install gitleaks"
            echo "   Linux: https://github.com/gitleaks/gitleaks#installing"
            exit 1
        fi
        echo "🔍 Scanning repository for secrets..."
        gitleaks detect --config .gitleaks.toml --verbose --report-path build/gitleaks-report.json
        echo "✅ No secrets detected!"
    '''
    
    ignoreExitValue = false
}

// Run secret scan before build
tasks.named('build') {
    dependsOn scanSecrets
}

// GpioService uses java.lang.foreign.Linker (FFM API) from an unnamed module.
// Pass --enable-native-access=ALL-UNNAMED so the JVM suppresses the restricted-method warning.
quarkusDev {
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

// Sync frontend version from gradle.properties (single source of truth).
// Strips -SNAPSHOT suffix because npm does not support it.
// Runs automatically before the Quinoa/npm build.
tasks.register('syncFrontendVersion') {
    group = 'build'
    description = 'Writes projectVersion (without -SNAPSHOT) into the frontend package.json'

    def propsFile = file('gradle.properties')
    def pkgFile   = file('src/main/webui/package.json')

    inputs.file(propsFile)
    outputs.file(pkgFile)

    doLast {
        def npmVersion = project.version.toString().replaceAll('-SNAPSHOT$', '')
        def pkg = pkgFile.text
        // Replace the "version": "..." line inside package.json
        pkg = pkg.replaceAll(/"version"\s*:\s*"[^"]*"/, '"version": "' + npmVersion + '"')
        pkgFile.text = pkg
        logger.lifecycle("Frontend version synced to ${npmVersion}")
    }
}

// Storybook tasks for component library development
def webuiDir = file('src/main/webui')
def quinoaNodeDir = file('.quinoa/node')
def npmCmd = quinoaNodeDir.exists() ? "${quinoaNodeDir}/npm" : 'npm'

tasks.register('storybook', Exec) {
    group = 'storybook'
    description = 'Start Storybook dev server on port 6006'
    
    workingDir webuiDir
    commandLine npmCmd, 'run', 'storybook'
}

tasks.register('buildStorybook', Exec) {
    group = 'storybook'
    description = 'Build static Storybook site to storybook-static/'
    
    workingDir webuiDir
    commandLine npmCmd, 'run', 'build-storybook'
    
    inputs.dir(file("${webuiDir}/src"))
    inputs.dir(file("${webuiDir}/.storybook"))
    outputs.dir(file("${webuiDir}/storybook-static"))
}
