replicaCount: 1

image:
  repository: wolfgangreder/at.or.reder.frodo
  tag: "3.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: frodo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

firebird:
  jdbcUrl: "jdbc:firebirdsql://<replace-with-host>:<replace-with-port>//<replace-with-db-path>?encoding=UTF8&charSet=utf-8"
  user: "sysdba"
  # password: set via --set firebird.password=... or external Secret
  password: "CHANGEME"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

prometheus:
  scrape: true
  path: /frodo/q/metrics
  port: "8082"

livenessProbe:
  httpGet:
    path: /frodo/q/health/live
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /frodo/q/health/ready
    port: 8082
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

# When set, the chart skips rendering its own Secret/ConfigMap and references
# the named external resources instead.  Set both in your values override file.
externalSecret:
  name: ""

externalConfig:
  name: ""
