# =============================================================================
# Frodo Quarkus Server Configuration
# =============================================================================

# --- Application ---
quarkus.application.name=frodo
quarkus.application.version=${project.version}

# --- HTTP Server ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- RESTEasy Reactive ---
# Restrict REST endpoints to /api/* path only
# This allows Quinoa to handle all other routes (SPA routing)
quarkus.rest.path=/api

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.info-title=Frodo API
quarkus.smallrye-openapi.info-version=${project.version}
quarkus.smallrye-openapi.info-description=Frodo Quarkus Server REST API
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# --- Micrometer / Prometheus Metrics ---
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true

# --- FirebirdSQL Datasource ---
# Configure the Firebird JDBC driver (Jaybird) via Agroal
# Database must be created with: PAGE_SIZE 32768, DEFAULT CHARACTER SET UTF8
# See docs/DATABASE_SETUP.md for database creation instructions
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.firebirdsql.jdbc.FBDriver
quarkus.datasource.jdbc.url=jdbc:firebirdsql://localhost:3050/frodo?defaultResultSetHoldable=true
quarkus.datasource.username=sysdba
quarkus.datasource.password=masterkey
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30
# Enable datasource in all modes (use Docker Firebird for dev)
# To disable database in dev mode, set: %dev.quarkus.datasource.active=false
# Disable datasource in test mode (no Firebird server required for unit tests)
%test.quarkus.datasource.active=false

# --- Hibernate ORM ---
# Liquibase manages schema, Hibernate validates against existing schema
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.FirebirdDialect
quarkus.hibernate-orm.metrics.enabled=true
quarkus.hibernate-orm.database.charset=UTF-8
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.highlight-sql=true
quarkus.hibernate-orm.log.queries-slower-than-ms=1000
quarkus.transaction-manager.default-transaction-timeout=10m
quarkus.hibernate-orm.jdbc.statement-batch-size=256
# Enable Hibernate ORM in dev mode (with Docker Firebird)
# Disable Hibernate ORM in test mode (no database for unit tests)
%test.quarkus.hibernate-orm.enabled=false

# --- Liquibase Database Migrations ---
# Migrations run automatically on server startup in all modes
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
# Enable Liquibase in dev mode (with Docker Firebird)
# Disable Liquibase in test mode (no database for unit tests)
%test.quarkus.liquibase.enabled=false

# --- MQTT Messaging ---
# Production: connect to real MQTT broker
mp.messaging.incoming.frodo-in.connector=smallrye-mqtt
mp.messaging.incoming.frodo-in.host=localhost
mp.messaging.incoming.frodo-in.port=1883
mp.messaging.incoming.frodo-in.topic=frodo/in
mp.messaging.outgoing.frodo-out.connector=smallrye-mqtt
mp.messaging.outgoing.frodo-out.host=localhost
mp.messaging.outgoing.frodo-out.port=1883
mp.messaging.outgoing.frodo-out.topic=frodo/out
# Disable MQTT in dev/test (no broker required)
%dev.mp.messaging.incoming.frodo-in.enabled=false
%dev.mp.messaging.outgoing.frodo-out.enabled=false
%test.mp.messaging.incoming.frodo-in.enabled=false
%test.mp.messaging.outgoing.frodo-out.enabled=false

# --- Health Checks & Monitoring (Stage 6) ---
# Maximum age (minutes) of last successful Modbus read before health check reports DOWN
frodo.modbus.health.max-age-minutes=15
# Whether SunSpec discovery is required for the SunSpec health check to pass
frodo.sunspec.health.discovery-required=false
# Maximum cache age (hours) for SunSpec discoveries before health check reports expired
frodo.sunspec.health.max-cache-age-hours=24

# --- Modbus TCP ---
frodo.modbus.enabled=true

# --- Modbus Write Operations ---
# Write operations (FC 0x06, FC 0x10) are disabled by default for safety.
# Set to true to enable writing to Modbus registers (e.g. SunSpec controls).
frodo.modbus.write-enabled=false

# --- SunSpec Model Format ---
# Preferred inverter model format: INT_SF (models 101-103) or FLOAT (models 111-113).
# The device exposes one format in its model chain; this setting controls which
# variant is preferred when selecting the inverter model for reading.
# Most Fronius Gen24 devices use Int&SF by default.
frodo.sunspec.model-format=INT_SF

# --- Modbus Device Configuration (Stage 3: Database-backed) ---
# Device seeding from properties (creates device if not exists)
frodo.modbus.device.host=localhost
frodo.modbus.device.port=502
frodo.modbus.device.unit-id=1
frodo.modbus.device.name=Default PV Device
frodo.modbus.device.seed-from-config=true
# frodo.modbus.device.description=Optional description
# Disable seeding in test mode
%test.frodo.modbus.device.seed-from-config=false

# --- Modbus Connection Pool Settings ---
frodo.modbus.connection.timeout-seconds=30
frodo.modbus.connection.reconnect-initial-delay-seconds=1
frodo.modbus.connection.reconnect-max-delay-seconds=60
# Connection test timeout (used by UI for testing device connectivity)
frodo.modbus.connection.test-timeout-seconds=30

# --- Modbus Request Settings ---
frodo.modbus.request.timeout-seconds=10
frodo.modbus.request.max-retries=3
frodo.modbus.request.retry-delay-seconds=2

# --- Modbus Device Info Collection & Caching (Stage 4) ---
frodo.modbus.device-info.refresh-interval=5m
frodo.modbus.device-info.cache-ttl-minutes=60
frodo.modbus.device-info.retry-attempts=3
frodo.modbus.device-info.retry-delay-seconds=5

# --- React UI (Quinoa) ---
# Node.js is automatically installed by Quinoa
quarkus.quinoa.package-manager-install.node-version=20.11.0
quarkus.quinoa.build-dir=build
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.dev-server.port=3001
# Enable SPA routing: serve index.html for all non-API routes (production build)
quarkus.quinoa.enable-spa-routing=true
# Quinoa will automatically ignore /api (REST) and /q (Quarkus management) paths
# Disable Quinoa in test mode (no Node.js build needed)
%test.quarkus.quinoa.enabled=false

# --- Container Image (Docker) ---
quarkus.container-image.group=at.or.reder
quarkus.container-image.name=frodo
quarkus.container-image.tag=${project.version}

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."at.or.reder.frodo".level=DEBUG
