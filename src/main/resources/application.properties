# =============================================================================
# Frodo Quarkus Server Configuration
# =============================================================================

# --- Application ---
quarkus.application.name=frodo
quarkus.application.version=${project.version}

# --- JVM ---
# GpioService uses java.lang.foreign.Linker (FFM API) from unnamed module.
# Suppress the restricted-method warning for both dev runner and prod runner.
quarkus.package.jvm-args=--enable-native-access=ALL-UNNAMED

# --- HTTP Server ---
quarkus.http.port=8082
quarkus.http.host=0.0.0.0

# --- RESTEasy Reactive ---
# Restrict REST endpoints to /api/* path only
# This allows Quinoa to handle all other routes (SPA routing)
quarkus.rest.path=/api

# --- Jackson ---
# Serialize dates as ISO 8601 strings, never as epoch milliseconds.
# Quarkus default is false, but explicit config prevents surprises on upgrades.
quarkus.jackson.write-dates-as-timestamps=false

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.info-title=Frodo API
quarkus.smallrye-openapi.info-version=${project.version}
quarkus.smallrye-openapi.info-description=Frodo Quarkus Server REST API
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# --- Micrometer / Prometheus Metrics ---
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true

# --- FirebirdSQL Datasource ---
# Configure the Firebird JDBC driver (Jaybird) via Agroal
# Database must be created with: PAGE_SIZE 32768, DEFAULT CHARACTER SET UTF8
# See docs/DATABASE_SETUP.md for database creation instructions
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.firebirdsql.jdbc.FBDriver
quarkus.datasource.jdbc.url=jdbc:firebirdsql://localhost:3050//var/lib/firebird/data/frodo.firebird?defaultResultSetHoldable=true
quarkus.datasource.username=sysdba
quarkus.datasource.password=masterkey
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30
# Enable datasource in all modes (use Docker Firebird for dev)
# To disable database in dev mode, set: %dev.quarkus.datasource.active=false
# Disable datasource in test mode (no Firebird server required for unit tests)
%test.quarkus.datasource.active=false

# --- Hibernate ORM ---
# Liquibase manages schema, Hibernate validates against existing schema
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.FirebirdDialect
quarkus.hibernate-orm.metrics.enabled=true
quarkus.hibernate-orm.database.charset=UTF-8
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.highlight-sql=true
quarkus.hibernate-orm.log.queries-slower-than-ms=1000
quarkus.transaction-manager.default-transaction-timeout=10m
quarkus.hibernate-orm.jdbc.statement-batch-size=256
# Enable Hibernate ORM in dev mode (with Docker Firebird)
# Disable Hibernate ORM in test mode (no database for unit tests)
%test.quarkus.hibernate-orm.enabled=false

# --- Liquibase Database Migrations ---
# Migrations run automatically on server startup in all modes
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
# Enable Liquibase in dev mode (with Docker Firebird)
# Disable Liquibase in test mode (no database for unit tests)
%test.quarkus.liquibase.enabled=false

# --- MQTT Messaging ---
# Production: connect to real MQTT broker
mp.messaging.incoming.frodo_in.connector=smallrye-mqtt
mp.messaging.incoming.frodo_in.host=localhost
mp.messaging.incoming.frodo_in.port=1883
mp.messaging.incoming.frodo_in.topic=frodo/in
mp.messaging.outgoing.frodo_out.connector=smallrye-mqtt
mp.messaging.outgoing.frodo_out.host=localhost
mp.messaging.outgoing.frodo_out.port=1883
mp.messaging.outgoing.frodo_out.topic=frodo/out
# Disable MQTT in dev/test/prod (no broker required by default)
%dev.mp.messaging.incoming.frodo_in.enabled=false
%dev.mp.messaging.outgoing.frodo_out.enabled=false
%test.mp.messaging.incoming.frodo_in.enabled=false
%test.mp.messaging.outgoing.frodo_out.enabled=false
%prod.mp.messaging.incoming.frodo_in.enabled=false
%prod.mp.messaging.outgoing.frodo_out.enabled=false

# --- Health Checks & Monitoring (Stage 6) ---
# Maximum age (minutes) of last successful Modbus read before health check reports DOWN
frodo.modbus.health.max-age-minutes=15
# Whether SunSpec discovery is required for the SunSpec health check to pass
frodo.sunspec.health.discovery-required=false
# Maximum cache age (hours) for SunSpec discoveries before health check reports expired
frodo.sunspec.health.max-cache-age-hours=24

# --- Modbus TCP ---
frodo.modbus.enabled=true

# --- Modbus Write Operations ---
# Write operations (FC 0x06, FC 0x10) are disabled by default for safety.
# Set to true to enable writing to Modbus registers (e.g. SunSpec controls).
frodo.modbus.write-enabled=true

# --- SunSpec Model Format ---
# Preferred inverter model format: INT_SF (models 101-103) or FLOAT (models 111-113).
# The device exposes one format in its model chain; this setting controls which
# variant is preferred when selecting the inverter model for reading.
# Most Fronius Gen24 devices use Int&SF by default.
frodo.sunspec.model-format=INT_SF

# --- Fronius Solar API ---
# Solar API integration for Ohmpilot device discovery and metrics.
# Base URL: http://{host}:{port}/solar_api/v1/
# Set enabled=true to enable Solar API queries for device discovery
# and to expose Solar API data as Prometheus metrics.
frodo.solar-api.enabled=true
frodo.solar-api.host=192.168.1.160
frodo.solar-api.port=80
frodo.solar-api.timeout-seconds=5
frodo.solar-api.scrape-interval-seconds=5
# Enable Solar API in dev mode for local testing
# %dev.frodo.solar-api.enabled=true
# %dev.frodo.solar-api.host=192.168.1.160

# --- REST Client for Solar API (MicroProfile REST Client) ---
# URL is constructed from frodo.solar-api.host and port settings above
quarkus.rest-client.solar-api.url=http://${frodo.solar-api.host}:${frodo.solar-api.port}
quarkus.rest-client.solar-api.connect-timeout=${frodo.solar-api.timeout-seconds}000
quarkus.rest-client.solar-api.read-timeout=${frodo.solar-api.timeout-seconds}000
# Disable REST client in test mode (no Solar API server available)
%test.quarkus.rest-client.solar-api.url=http://localhost:19999

# --- Device Discovery ---
# Unit ID ranges to scan during discovery (comma-separated, supports ranges).
# Default: 1 (inverter), 200-203 (up to 4 smart meters).
frodo.discovery.enabled=true
frodo.discovery.unit-id-ranges=1,200-203
frodo.discovery.timeout-seconds=3
frodo.discovery.max-concurrent-scans=5

# --- Modbus Device Configuration (Stage 3: Database-backed) ---
# Device seeding from properties (creates device if not exists)
frodo.modbus.device.host=localhost
frodo.modbus.device.port=502
frodo.modbus.device.unit-id=1
frodo.modbus.device.name=Default PV Device
frodo.modbus.device.seed-from-config=true
# frodo.modbus.device.description=Optional description
# Disable seeding in test mode
%test.frodo.modbus.device.seed-from-config=false

# --- Modbus Connection Pool Settings ---
frodo.modbus.connection.timeout-seconds=30
frodo.modbus.connection.reconnect-initial-delay-seconds=1
frodo.modbus.connection.reconnect-max-delay-seconds=60
# Connection test timeout (used by UI for testing device connectivity)
frodo.modbus.connection.test-timeout-seconds=30

# --- Modbus Request Settings ---
frodo.modbus.request.timeout-seconds=10
frodo.modbus.request.max-retries=3
frodo.modbus.request.retry-delay-seconds=2

# --- Modbus Device Info Collection & Caching (Stage 4) ---
frodo.modbus.device-info.refresh-interval=5m
frodo.modbus.device-info.cache-ttl-minutes=60
frodo.modbus.device-info.retry-attempts=3
frodo.modbus.device-info.retry-delay-seconds=5

# --- React UI (Quinoa) ---
# Use system Node.js/npm (bundled npm 10.8.2 broken on Node 20.19.0)
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.build-dir=dist
quarkus.quinoa.dev-server.port=3001
# Enable SPA routing: serve index.html for all non-API routes (production build)
quarkus.quinoa.enable-spa-routing=true
# Quinoa will automatically ignore /api (REST) and /q (Quarkus management) paths
# Disable Quinoa in test mode (no Node.js build needed)
%test.quarkus.quinoa.enabled=false

# --- Test HTTP Port ---
# Use a random available port in test mode to avoid conflicts with other services.
# RestAssured automatically reads the assigned port via @TestHTTPEndpoint / quarkus.http.test-port.
%test.quarkus.http.test-port=0
%test.quarkus.http.test-ssl-port=0

# --- Container Image (Docker) ---
quarkus.container-image.registry=docker.io
quarkus.container-image.group=wolfgangreder
quarkus.container-image.name=at.or.reder.frodo
quarkus.container-image.tag=${project.version}

# --- aWATTar AT Market Data API ---
# Enable fetching hourly market prices from aWATTar AT
frodo.awattar.enabled=true
# Retention is handled by MetricsRetentionService (365 days)

# --- REST Client for aWATTar API (MicroProfile REST Client) ---
quarkus.rest-client.awattar-api.url=https://api.awattar.at
quarkus.rest-client.awattar-api.connect-timeout=10000
quarkus.rest-client.awattar-api.read-timeout=10000
# Disable aWATTar REST client in test mode (no external API available)
#%test.quarkus.rest-client.awattar-api.url=http://localhost:19998
%test.quarkus.rest-client.awattar-api.url=https://api.awattar.at

# --- GPIO Export Control ---
# Enable GPIO-based export control using Linux GPIO character device API.
# Requires Raspberry Pi with Linux kernel 5.10+ (GPIO v2 ABI).
frodo.gpio.enabled=false
frodo.gpio.chip-device=/dev/gpiochip0
frodo.gpio.consumer-label=frodo-export-control
# Force Raspberry Pi platform detection, skipping /proc/cpuinfo check.
# Set to true in Docker containers where /proc/cpuinfo is unavailable.
frodo.gpio.force-platform=false
# Named GPIO pairs: each pair has an output pin (relay control) and an input pin (external switch).
# Example configuration (uncomment to enable):
# frodo.gpio.pairs.relay1.output-pin=17
# frodo.gpio.pairs.relay1.output-block-level=HIGH
# frodo.gpio.pairs.relay1.input-pin=27
# frodo.gpio.pairs.relay1.input-active-level=HIGH
# frodo.gpio.pairs.relay1.input-bias=PULL_DOWN
# frodo.gpio.pairs.relay2.output-pin=22
# frodo.gpio.pairs.relay2.output-block-level=HIGH
# frodo.gpio.pairs.relay2.input-pin=23
# frodo.gpio.pairs.relay2.input-active-level=HIGH
# frodo.gpio.pairs.relay2.input-bias=PULL_DOWN

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."at.or.reder.frodo".level=INFO
quarkus.log.category."at.or.reder.frodo.modbus.service".level=INFO
quarkus.log.category."at.or.reder.frodo.modbus.service.ExportSchedulerService".level=DEBUG